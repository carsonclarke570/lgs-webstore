name: "CI/CD"

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
    
jobs:
  lint:
    runs-on: ubuntu-latest
    name: "Lint"
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript compiler
        run: npm run type-check

  unit-tests:
    runs-on: ubuntu-latest
    name: "CI/CD - Unit Tests"
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run unit tests
        run: npm run test:unit
  
  integration-tests:
    runs-on: ubuntu-latest
    name: "Integration Tests"
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: respite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Run Prisma migrations
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/respite_test
          DIRECT_URL: postgresql://test:test@localhost:5432/respite_test
        run: npx prisma migrate deploy

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/respite_test
          DIRECT_URL: postgresql://test:test@localhost:5432/respite_test
        run: npx prisma generate
      
      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/respite_test
          DIRECT_URL: postgresql://test:test@localhost:5432/respite_test
        run: npm run test:integration

  e2e-tests:
    runs-on: ubuntu-latest
    name: "E2E Tests"
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: respite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run Prisma migrations
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/respite_test
          DIRECT_URL: postgresql://test:test@localhost:5432/respite_test
        run: npx prisma migrate deploy
      
      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/respite_test
          DIRECT_URL: postgresql://test:test@localhost:5432/respite_test
        run: npx prisma generate

      - name: Build application
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Run E2E tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/respite_test
          DIRECT_URL: postgresql://test:test@localhost:5432/respite_test
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: test-secret
        run: npm run test:e2e