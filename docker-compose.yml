services:

  # Redis
  redis:
    image: redis:7-alpine
    container_name: medusa_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - medusa_network

  # Medusa Server
  # This service runs the Medusa backend application
  # and the admin dashboard.
  medusa:
    build: ./app
    container_name: medusa_backend
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - "9000:9000"
    env_file:
      - .env.local
    volumes:
      - ./app:/server
      - /server/node_modules
    networks:
      - medusa_network

volumes:
  postgres_data:

networks:
  medusa_network:
    driver: bridge